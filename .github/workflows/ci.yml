name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    # The infrastructure crate is Win32-specific, so the whole workspace builds
    # on Windows. Tests that need raw disk access detect the missing privilege
    # and return early rather than failing the run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Nothing compiles the window's script, so a syntax error in it reaches
      # the user as a window that draws and then does nothing. That is how
      # 0.3.0 shipped: a duplicated `const` block, a script that never ran,
      # and a device list frozen on its placeholder.
      - name: Window scripts
        run: Get-ChildItem ui -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }

      # A step the backend can emit with no wording in the window reaches the
      # user as its own identifier, and nothing fails. 0.6.0 shipped exactly
      # that. The check spans Rust and JavaScript, so neither compiler sees it.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Interface strings
        run: python tools/check_strings.py

      # A sentence that takes arguments and does not get them reaches the user
      # with a brace in it, in one language, and nothing anywhere fails.
      - name: Sentence arguments
        run: node tools/check_placeholders.mjs

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # A dependency advisory is a defect like any other, and finding it at release
  # time is finding it too late.
  #
  # Its own job, on Linux, for two reasons: building cargo-audit would add
  # minutes to the Windows job that everything else waits on, and running the
  # tool directly avoids rustsec/audit-check, which publishes its result as a
  # check run and so needs an API permission the workflow token does not carry.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Dependency audit
        run: cargo audit

  # The domain and application layers carry no OS dependency. Building them on
  # Linux proves that claim instead of merely asserting it in the README.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core and application build without Windows
        run: cargo test -p salvage-core -p salvage-app
